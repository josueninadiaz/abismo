<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Abismo</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #05060c; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: ui-monospace, Menlo, monospace; color: #e8e0d0; }
  canvas#gl { position: absolute; display: block; image-rendering: pixelated; }
  #nogl { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; text-align: center; padding: 24px; }

  /* controles táctiles */
  #touch { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .t-stick-zone { position: absolute; left: 0; bottom: 0; width: 50%; height: 60%; pointer-events: auto; }
  .t-stick { position: absolute; left: calc(env(safe-area-inset-left) + 40px); bottom: calc(env(safe-area-inset-bottom) + 40px); width: 110px; height: 110px;
    border-radius: 50%; border: 2px solid rgba(216,191,134,0.35); background: rgba(10,10,20,0.25); opacity: 0.55; }
  .t-stick.on { opacity: 1; bottom: auto; }
  .t-knob { position: absolute; left: 33px; top: 33px; width: 44px; height: 44px; border-radius: 50%;
    background: rgba(216,191,134,0.55); border: 2px solid rgba(255,244,208,0.8); }
  .t-pad { position: absolute; right: calc(env(safe-area-inset-right) + 18px); bottom: calc(env(safe-area-inset-bottom) + 22px); width: 170px; height: 150px; }
  .t-btn { position: absolute; pointer-events: auto; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 2px solid rgba(216,191,134,0.6); background: rgba(12,12,24,0.55); color: #f4ecd8;
    font: bold 15px ui-monospace, Menlo, monospace; text-shadow: 0 1px 0 #000; }
  .t-btn.on { background: rgba(216,191,134,0.5); }
  .t-a { right: 0; bottom: 40px; width: 70px; height: 70px; font-size: 20px; }
  .t-b { right: 78px; bottom: 0; width: 56px; height: 56px; }
  .t-x { right: 84px; bottom: 76px; width: 56px; height: 56px; font-size: 12px; }
  .t-y { right: 6px; bottom: 118px; width: 48px; height: 48px; }
  .t-menu { position: fixed; top: calc(env(safe-area-inset-top) + 10px); right: calc(env(safe-area-inset-right) + 10px); width: 44px; height: 44px; font-size: 20px; border-radius: 10px; }
  .t-skills { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 8px); display: flex; gap: 6px; pointer-events: none; }
  .t-skill { position: relative; width: 62px; height: 34px; border-radius: 8px; font-size: 10px; border-color: var(--c); color: var(--c); overflow: hidden;
    background: linear-gradient(to top, rgba(0,0,0,0.75) var(--cd, 0%), rgba(12,12,24,0.55) var(--cd, 0%)); }
  .t-skill.want { box-shadow: 0 0 10px var(--c); }
  .t-rotate { display: none; position: absolute; left: 0; right: 0; top: calc(56.25vw + 120px); text-align: center; font-size: 13px; color: #9a94a8; }
  @media (orientation: portrait) { .t-rotate { display: block; } }
  @media (orientation: portrait) {
    .t-skills { bottom: auto; top: calc(58vw + 30px); }
    .t-stick-zone { height: 45%; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="touch"></div>
<div id="nogl">Este juego necesita WebGL. Prueba con otro navegador o activa la aceleración por hardware.</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/font.js"></script>
<script src="js/gfx.js"></script>
<script src="js/art.js"></script>
<script src="js/actors.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/world3d.js"></script>
<script src="js/ambient.js"></script>
<script src="js/zones.js"></script>
<script src="js/scene.js"></script>
<script src="js/ui.js"></script>
<script src="js/explore.js"></script>
<script src="js/combat.js"></script>
<script src="js/story.js"></script>
<script src="js/touch.js"></script>
<script src="js/main.js"></script>
</body>
</html>
